name: Release

# SWIFT-2 / e2e ADR-0002: this is the CANDIDATE build. It is dispatch-only —
# pushing a tag triggers nothing, and tags are created exactly once, at
# promotion, on the release commit this workflow produces (SDK-4 owns the
# promote workflow). Tags are never moved (sync ADR-0030).
#
#   candidate:  gh workflow run release.yml -f version=0.6.0 [-f dry_run=true]
#   promote:    (SDK-4) verify the staged bytes, tag the release commit,
#               publish the draft release — same bytes, no rebuild.
#
# The release commit carries Package.swift with the version/url/checksum
# constants stamped (scripts/stamp-package.sh) so gates G8/G9 can read the
# exact artifact URL and checksum out of the tagged tree.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK release version without the v prefix (lockstep TrueSeal Release, e.g. 0.6.0)"
        required: true
        type: string
      dry_run:
        description: "Build, test and stamp only — no branch, no release"
        required: false
        type: boolean
        default: false
      # Conductor override (e2e ADR-0002 step 4): the Release Conductor may
      # build this SDK's candidate against a core CANDIDATE tag (staged by
      # the core's candidate.yml and mirrored into this repo's core-<tag>
      # release by scripts/mirror-core-artifact.sh) instead of the committed
      # pin. Both fields must be given together; when omitted the committed
      # env pin below is used. The checksum is still verified — an override
      # changes WHICH pinned bytes, never WHETHER the bytes are pinned.
      core_tag:
        description: "Override core release tag (default: the committed pin)"
        required: false
        type: string
        default: ""
      core_zip_sha256:
        description: "sha256 of the overridden core zip (required with core_tag)"
        required: false
        type: string
        default: ""

env:
  # ── The core pin (G8) — see ci.yml for the full contract. An exact core
  # release tag + the sha256 of the core release's PUBLISHED zip, COMMITTED
  # here (a repo variable is mutable without review; it can never be the pin).
  TRUESEAL_SYNC_TAG: v0.6.0
  TRUESEAL_SYNC_ZIP_SHA256: ea050baf939fda79da7327f2c5e6b068c4f74156655b84c9f1159e910aad66c3

permissions:
  contents: write

jobs:
  candidate:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z without a v prefix (got '$VERSION')"; exit 1; }

      # The effective core pin: the conductor override when given, else the
      # committed env constants. An override tag REQUIRES its own checksum.
      - name: Resolve the effective core pin
        env:
          OVERRIDE_TAG: ${{ inputs.core_tag }}
          OVERRIDE_SHA: ${{ inputs.core_zip_sha256 }}
        run: |
          if [ -n "$OVERRIDE_TAG" ]; then
            [ -n "$OVERRIDE_SHA" ] || { echo "::error::core_tag requires core_zip_sha256 — an override is still an exact pin (G8)"; exit 1; }
            echo "$OVERRIDE_SHA" | grep -qE '^[0-9a-f]{64}$' \
              || { echo "::error::core_zip_sha256 must be 64 lowercase hex chars"; exit 1; }
            echo "EFFECTIVE_CORE_TAG=$OVERRIDE_TAG" >> "$GITHUB_ENV"
            echo "EFFECTIVE_CORE_SHA=$OVERRIDE_SHA" >> "$GITHUB_ENV"
            echo "conductor override: core $OVERRIDE_TAG @ $OVERRIDE_SHA"
          else
            echo "EFFECTIVE_CORE_TAG=${{ env.TRUESEAL_SYNC_TAG }}" >> "$GITHUB_ENV"
            echo "EFFECTIVE_CORE_SHA=${{ env.TRUESEAL_SYNC_ZIP_SHA256 }}" >> "$GITHUB_ENV"
            echo "committed pin: core ${{ env.TRUESEAL_SYNC_TAG }}"
          fi

      # Download the pinned core artifact (xcframework + UniFFI bindings).
      # The bytes are the core release's trueseal-sync-swift-<tag>.zip,
      # republished byte-exact under this repo's core-<tag> release so the
      # default GITHUB_TOKEN suffices (the cross-repo TRUESEAL_READ_TOKEN
      # PAT is expired — maintainer item A6; scripts/mirror-core-artifact.sh
      # performs and verifies the mirror). The checksum verified below is the
      # CORE release's published checksum — an exact version+checksum pin (G8).
      - name: Download pinned core artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_TAG: core-${{ env.EFFECTIVE_CORE_TAG }}
        run: |
          gh release download "$CORE_TAG" \
            --repo ${{ github.repository }} \
            --pattern "trueseal-sync-swift-${{ env.EFFECTIVE_CORE_TAG }}.zip" \
            --output trueseal-sync-swift.zip

      - name: Verify core artifact checksum
        run: |
          echo "${{ env.EFFECTIVE_CORE_SHA }}  trueseal-sync-swift.zip" | shasum -a 256 -c -

      - name: Extract xcframework and bindings
        run: |
          unzip -q trueseal-sync-swift.zip
          rm -rf TruesealSyncFFI.xcframework
          cp -R trueseal-swift-staging/TruesealSyncFFI.xcframework .
          rm -f Sources/TruesealSyncBindings/*.swift
          cp trueseal-swift-staging/trueseal_sync.swift \
             Sources/TruesealSyncBindings/trueseal_sync.swift

      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test

      # ── Package ────────────────────────────────────────────────────────────

      - name: Zip XCFramework
        run: zip -r TruesealSyncFFI.xcframework.zip TruesealSyncFFI.xcframework

      - name: Compute checksum
        id: checksum
        run: |
          echo "value=$(swift package compute-checksum TruesealSyncFFI.xcframework.zip)" \
            >> "$GITHUB_OUTPUT"

      # ── Stamp the release pin constants (SWIFT-2) ───────────────────────────
      # version / artifactURL / artifactChecksum at the top of Package.swift.
      # The URL is deterministic from the version, so the release commit can
      # be written before the tag (and the release) exist.

      - name: Stamp Package.swift constants
        env:
          VERSION:  ${{ inputs.version }}
          CHECKSUM: ${{ steps.checksum.outputs.value }}
          REPO:     ${{ github.repository }}
        run: scripts/stamp-package.sh "$VERSION" "$CHECKSUM"

      # CI check (G8/G9): the stamped manifest must record THIS candidate's
      # version in the URL (never a stale one — the old sed flow shipped a
      # Package.swift still pointing at v0.2.0) and the checksum constant
      # must equal the checksum of the staged artifact.
      - name: Verify the stamped release pin
        env:
          VERSION:  ${{ inputs.version }}
          CHECKSUM: ${{ steps.checksum.outputs.value }}
        run: |
          grep -q "releases/download/v${VERSION}/TruesealSyncFFI.xcframework.zip" Package.swift \
            || { echo "::error::stamped URL does not name the candidate version v${VERSION}"; exit 1; }
          grep -q "^let artifactChecksum = \"${CHECKSUM}\"$" Package.swift \
            || { echo "::error::stamped checksum does not match the staged artifact"; exit 1; }
          RECOMPUTED="$(swift package compute-checksum TruesealSyncFFI.xcframework.zip)"
          [ "$RECOMPUTED" = "$CHECKSUM" ] \
            || { echo "::error::checksum drift between stamp and verification"; exit 1; }
          swift package dump-package > /dev/null
          echo "Release pin verified: v${VERSION} / ${CHECKSUM}"

      - name: Upload stamped Package.swift
        uses: actions/upload-artifact@v4
        with:
          name: stamped-package-swift
          path: Package.swift
          if-no-files-found: error

      # ── Release commit + draft release (skipped on dry runs) ────────────────
      # The release commit lives on a release/v<version> branch, pushed
      # WITHOUT force — if it already exists this fails, and a re-candidate
      # for the same version must delete the branch first (a candidate is
      # staged once per version; promotion never rebuilds).

      - name: Commit the release pin and bindings
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${VERSION}"
          git add Package.swift Sources/TruesealSyncBindings/
          git commit -m "chore: release pin for v${VERSION} (url + checksum constants)"
          git push origin "release/v${VERSION}"

      - name: Create draft candidate release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TrueSeal ${{ inputs.version }} (candidate)
          draft: true
          prerelease: true
          target_commitish: release/v${{ inputs.version }}
          files: TruesealSyncFFI.xcframework.zip
          body: |
            Candidate for the TrueSeal ${{ inputs.version }} lockstep release.

            - **core**: trueseal-sync ${{ env.EFFECTIVE_CORE_TAG }} (checksum-pinned)
            - **xcframework checksum**: ${{ steps.checksum.outputs.value }}
            - **release commit**: `release/v${{ inputs.version }}` (Package.swift stamped with the version/url/checksum constants)

            Promotion (SDK-4) creates the immutable tag `v${{ inputs.version }}` on the release commit and publishes this draft — same bytes, no rebuild (e2e ADR-0002).
          fail_on_unmatched_files: true
