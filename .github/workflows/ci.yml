name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TRUESEAL_SYNC_TAG: v0.6.0

jobs:
  ci:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download the pinned core artifact (xcframework + UniFFI bindings).
      # The bytes are the core release's trueseal-sync-swift-<tag>.zip,
      # republished byte-exact under this repo's core-<tag> release so the
      # default GITHUB_TOKEN suffices (the cross-repo TRUESEAL_READ_TOKEN
      # PAT is expired). The expected sha256 below is the CORE release's
      # published checksum — an exact version+checksum pin (G8).
      - name: Download pinned core artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_TAG: core-${{ env.TRUESEAL_SYNC_TAG }}
        run: |
          gh release download "$CORE_TAG" \
            --repo ${{ github.repository }} \
            --pattern "trueseal-sync-swift-${{ env.TRUESEAL_SYNC_TAG }}.zip" \
            --output trueseal-sync-swift.zip

      - name: Verify core artifact checksum
        run: |
          EXPECTED="${{ vars.CORE_SWIFT_ZIP_SHA256 || '61557fb4b084087ee6fbd757647c0cef604adb45144cc7a98e03c6d5ebf6c3c8' }}"
          echo "$EXPECTED  trueseal-sync-swift.zip" | shasum -a 256 -c -

      - name: Extract xcframework and bindings
        run: |
          unzip -q trueseal-sync-swift.zip
          rm -rf TruesealSyncFFI.xcframework
          cp -R trueseal-swift-staging/TruesealSyncFFI.xcframework .
          rm -f Sources/TruesealSyncBindings/*.swift
          cp trueseal-swift-staging/trueseal_sync.swift \
             Sources/TruesealSyncBindings/trueseal_sync.swift

      - name: Swift build
        run: swift build

      - name: Swift test
        env:
          TRUSEAL_VECTOR_REPORT: ${{ runner.temp }}/trueseal-g5-vectors-report.json
        run: swift test

      # SDK-2 (G5): the vector-check report is Release Evidence for the
      # Release Conductor. Uploaded even on failure so a red run keeps its
      # record of which section failed.
      - name: Upload G5 vector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trueseal-g5-vectors-report
          path: ${{ runner.temp }}/trueseal-g5-vectors-report.json
          if-no-files-found: warn

      # SDK-3: TrueSeal.info / maxPayloadBytes / maxGroupSize are pass-throughs
      # of the core's FFI statics. No version or limit literal may be
      # hand-written in the SDK sources — drift is impossible by construction
      # and this grep keeps it that way (the generated TruesealSyncBindings
      # directory is the core's own output and is excluded by path).
      - name: No hand-written version or limit literals in SDK sources
        run: |
          if grep -REn '61440|61_440|65519|65_519|"[0-9]+\.[0-9]+\.[0-9]+"' Sources/TruesealSync/; then
            echo "::error::hand-written version/limit literal in SDK sources — values must come from the core's FFI statics (SDK-3)"
            exit 1
          fi

      # SWIFT-2: main is always source state — the release pin constants must
      # be present and artifactURL EMPTY (a stamped url: form on main means a
      # release commit leaked back; SPM consumers get the stamped form only
      # from the immutable tag). The release-side check (stamped URL names
      # the candidate version + checksum matches the staged artifact) runs in
      # release.yml.
      - name: Package.swift release pin is in source state
        run: |
          grep -q '^let version = "[0-9]\+\.[0-9]\+\.[0-9]\+"$' Package.swift \
            || { echo "::error::Package.swift is missing the version constant (SWIFT-2)"; exit 1; }
          grep -q '^let artifactURL = ""$' Package.swift \
            || { echo "::error::artifactURL is stamped on main — main must stay in path: source state (SWIFT-2)"; exit 1; }
          grep -q '^let artifactChecksum = ""$' Package.swift \
            || { echo "::error::artifactChecksum is stamped on main — main must stay in path: source state (SWIFT-2)"; exit 1; }
          swift package dump-package > /dev/null
