name: Promote

# SDK-4 / e2e ADR-0002: promotion publishes the EXACT bytes the candidate
# (release.yml) staged and the gate tested — the same draft, published, no
# rebuild. The immutable tag v<version> is created ONLY here, on the release
# commit (release/v<version>) whose Package.swift carries the stamped
# version/url/checksum constants; tags are never moved (sync ADR-0030), so
# a bad release is a new patch version.
#
# Idempotent (ADR-0002 "Failures": a failed promotion is retried forward,
# a re-run publishes only missing channels): if v<version> is already
# published this is a no-op success.
#
# The Release Conductor (trueseal-e2e) dispatches this after a green gate;
# a maintainer can do the same by hand:
#   gh workflow run promote.yml -f version=0.6.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep version to promote, e.g. 0.6.0 (no leading v)"
        required: true
        type: string

concurrency:
  group: promote-swift-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: verify staged bytes + publish
    runs-on: macos-latest

    steps:
      - name: Validate the version input
        run: |
          echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "FAIL: version must be X.Y.Z without a leading v"; exit 1; }

      - name: Resolve the staged release
        id: staged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if ! gh release view "$TAG" --json isDraft,targetCommitish > /tmp/staged.json 2>/dev/null; then
            echo "FAIL: no release $TAG — run the candidate build (release.yml) for ${{ inputs.version }} first" >&2
            exit 1
          fi
          IS_DRAFT=$(jq -r .isDraft /tmp/staged.json)
          TARGET=$(jq -r .targetCommitish /tmp/staged.json)
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "staged: draft=$IS_DRAFT target=$TARGET"

      # ADR-0002: a re-run on an already-live channel has nothing to do.
      - name: Already published — idempotent no-op
        if: steps.staged.outputs.is_draft == 'false'
        run: echo "v${{ inputs.version }} is already published; nothing to do"

      # Tags are immutable (ADR-0030). If the tag exists while the release is
      # still a draft, someone created it out of band — never overwrite or
      # move it; stop and let a human untangle.
      - name: Refuse to touch an existing tag
        if: steps.staged.outputs.is_draft == 'true'
        run: |
          TAG="v${{ inputs.version }}"
          if git ls-remote --tags "https://github.com/${{ github.repository }}.git" "$TAG" | grep -q "$TAG"; then
            echo "FAIL: tag $TAG already exists on origin but the release is still a draft — tags are never moved; investigate by hand" >&2
            exit 1
          fi

      - name: Checkout the release commit
        if: steps.staged.outputs.is_draft == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.staged.outputs.target }}

      # G8/G9 hard gate on the bytes being promoted: the release commit's
      # stamped constants must name THIS version, THIS repo's download URL
      # and the checksum of the staged artifact — recomputed from the staged
      # bytes with the same tool the candidate used. If the gate tested
      # these bytes, publishing them is safe; anything else fails here.
      - name: Verify the staged bytes against the release commit's stamped pin
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          TAG="v$VERSION"
          ZIP="TruesealSyncFFI.xcframework.zip"

          grep -q "^let version = \"$VERSION\"$" Package.swift \
            || { echo "FAIL: release commit's Package.swift version is not $VERSION" >&2; exit 1; }

          EXPECTED_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$ZIP"
          grep -q "^let artifactURL = \"$EXPECTED_URL\"$" Package.swift \
            || { echo "FAIL: stamped artifactURL is not $EXPECTED_URL" >&2; exit 1; }

          STAMPED=$(sed -n 's/^let artifactChecksum = "\(.*\)"$/\1/p' Package.swift)
          [ -n "$STAMPED" ] || { echo "FAIL: artifactChecksum is empty on the release commit" >&2; exit 1; }

          gh release download "$TAG" --pattern "$ZIP" --output "/tmp/$ZIP" --clobber
          RECOMPUTED=$(swift package compute-checksum "/tmp/$ZIP")
          [ "$RECOMPUTED" = "$STAMPED" ] \
            || { echo "FAIL: staged bytes ($RECOMPUTED) != stamped checksum ($STAMPED) — refusing to publish bytes the release commit does not name" >&2; exit 1; }
          echo "OK: staged bytes match the release commit's stamped pin ($STAMPED)"

      # Release notes: the one lockstep changelog lives in trueseal-sync with
      # a section per SDK (ADR-0002 "Release notes"); every GitHub Release in
      # the group links to it. The notes also carry the evidence a consumer
      # needs to verify what they installed.
      - name: Publish the staged bytes (creates the immutable tag)
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          STAMPED=$(sed -n 's/^let artifactChecksum = "\(.*\)"$/\1/p' Package.swift)
          cat > /tmp/release-notes.md <<EOF
          TrueSeal $VERSION — Swift SDK (lockstep release).

          Changelog: the [TrueSeal $VERSION section](https://github.com/julianbonomini/trueseal-sync/blob/main/CHANGELOG.md)
          of the one lockstep changelog, subsection **trueseal-sync-swift**
          (e2e ADR-0002: one changelog per TrueSeal Release, linked from every
          release in the group; breaking releases carry upgrade steps there).

          Install: SwiftPM \`binaryTarget\` on the tag \`$TAG\` (immutable —
          ADR-0030). This is a Developer Preview: any 0.x release may break
          the API, the wire format or stored data without notice (ADR-0033).

          - core: trueseal-sync $TAG (checksum-pinned at candidate time)
          - TruesealSyncFFI.xcframework.zip sha256: \`$STAMPED\`
          EOF
          gh release edit "$TAG" \
            --title "TrueSeal $VERSION" \
            --notes-file /tmp/release-notes.md \
            --draft=false \
            --prerelease=false
          echo "published $TAG"

      - name: Confirm the tag is live on the release commit
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          git ls-remote --tags origin "$TAG" | grep -q "$TAG" \
            || { echo "FAIL: tag $TAG not on origin after publish" >&2; exit 1; }
          gh release view "$TAG" --json isDraft --jq .isDraft | grep -q false \
            || { echo "FAIL: release still a draft after publish" >&2; exit 1; }
          echo "OK: $TAG published; tag on origin at ${{ steps.staged.outputs.target }}"
